version: '3.8'

services:
  prusalapse:
    image: prusalapse:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prusalapse
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persistent timelapses (photos, MP4 videos, TAR backups)
      - ./captures:/app/public/captures
      # Persistent configuration (Printer IP, API Key, Camera settings)
      - ./config:/app/config
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - TZ=UTC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
