[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200

# Serial Monitor Settings to avoid resetting or stalling the ESP32-CAM
monitor_rts = 0
monitor_dtr = 0

# Clock and Flash Configuration
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio

# Require sufficient memory for capturing high-res images
board_build.partitions = partitions.csv
build_flags = 
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    mathieucarbou/ESPAsyncWebServer @ ^3.4.5
    mathieucarbou/AsyncTCP @ ^3.3.1
